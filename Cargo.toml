[package]
name = "nddev-device-sync-browser-use"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-browser-use"

[[bin]]
name = "nds-browser-use"
path = "src/bin/nds-browser-use.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(any(unix, windows))'.dependencies]
tracing = "0.1"
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "a45a0d980d1e39260dfc7e6d6cbda55b02991d35" }
nddev-device-sync-telemetry = { version = "=0.0.1-alpha.11", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "32f21f8a8f9c313bee9dcd1769c042133b5520da" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

# Windows has AF_UNIX sockets but tokio does not drive them; async-io does, without unsafe code.
[target.'cfg(windows)'.dependencies]
async-io = "2.6"
futures-io = "0.3.34"
uds_windows = "1.2.1"
windows-registry = "0.100"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
