<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NDS agent control</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 12px; min-width: 220px; }
      button { margin-top: 8px; width: 100%; padding: 6px; }
      fieldset { border: 0; margin: 12px 0 0; padding: 0; }
      legend { font-weight: 600; padding: 0; }
      .profiles { display: flex; gap: 4px; }
      .profiles button { margin-top: 6px; }
      .profiles button[aria-pressed="true"] { font-weight: 600; outline: 2px solid currentColor; }
      #observation, #recording, #recent-note, .note { color: GrayText; margin: 6px 0 0; }
      #recent { margin: 6px 0 0; padding-left: 0; list-style: none; font: 12px ui-monospace, monospace; }
      #recent li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
      #private { margin: 6px 0 0; padding-left: 0; list-style: none; }
      #private button { width: auto; margin: 0 0 0 6px; padding: 0 6px; }
    </style>
  </head>
  <body>
    <strong>NDS agent control</strong>
    <p id="state">…</p>
    <button id="toggle" type="button" disabled>…</button>
    <fieldset>
      <legend>Observation</legend>
      <div class="profiles">
        <button type="button" data-profile="full" aria-pressed="false" disabled>Full</button>
        <button type="button" data-profile="standard" aria-pressed="false" disabled>Standard</button>
        <button type="button" data-profile="off" aria-pressed="false" disabled>Off</button>
      </div>
      <p id="observation"></p>
    </fieldset>
    <fieldset id="recorder">
      <legend>Show the agent how</legend>
      <button id="record" type="button" disabled>Record what I do</button>
      <p id="recording"></p>
    </fieldset>
    <fieldset id="activity">
      <legend>What the agent did here</legend>
      <ol id="recent"></ol>
      <p id="recent-note"></p>
    </fieldset>
    <fieldset>
      <legend>Private sites</legend>
      <p class="note">Agents still work there, but their activity journal keeps no content of them.</p>
      <button id="private-add" type="button" disabled>Keep this site private</button>
      <ul id="private"></ul>
    </fieldset>
    <p><a href="https://nddev.ai" target="_blank" rel="noreferrer">NDDev OpenNetwork</a></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
