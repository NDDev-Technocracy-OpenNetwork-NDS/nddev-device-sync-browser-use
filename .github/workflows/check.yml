name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Install pinned quality tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@70226500214618c56bf0d8896bf58ff1402cb74d # std-0004-v0.3.3
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Run the module checks
        run: just check
      - name: Fetch the pinned Chrome for Testing
        run: |
          url="$(jq -r .mac_arm64.asset provider.lock.json)"
          curl --fail --location --max-time 300 "$url" --output "$RUNNER_TEMP/chrome.zip"
          test "$(stat -f %z "$RUNNER_TEMP/chrome.zip")" = "$(jq -r .mac_arm64.size provider.lock.json)"
          echo "$(jq -r .mac_arm64.sha256 provider.lock.json)  $RUNNER_TEMP/chrome.zip" | shasum -a 256 --check --strict
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/cft"
          echo "NDS_TEST_CHROME=$RUNNER_TEMP/cft/$(jq -r .mac_arm64.executables.NDS_TEST_CHROME provider.lock.json)" >> "$GITHUB_ENV"
      - name: Real-browser acceptance in an isolated profile
        run: just browser-check

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Lint and test the platform-neutral code
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Require an honest unsupported host
        shell: bash
        run: |
          set +e
          output="$(cargo run --locked --quiet --bin nds-browser-use -- status 2>&1)"
          status=$?
          set -e
          test "$status" = 2
          grep -q 'not supported on this platform' <<< "$output"
