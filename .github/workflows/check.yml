name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - name: Install pinned Rust toolchain
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Restore the Cargo dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare locked source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Run the native project commands
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: ci-verify

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - name: Install pinned Rust toolchain
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
          tools: cargo-deny@0.20.2
      - name: Restore the Cargo dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare the locked module source inputs
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: setup
      - name: Run the module checks and tests
        run: just check test
      - name: Fetch the pinned Chrome for Testing
        run: |
          url="$(jq -r .mac_arm64.asset provider.lock.json)"
          curl --fail --location --max-time 300 "$url" --output "$RUNNER_TEMP/chrome.zip"
          test "$(stat -f %z "$RUNNER_TEMP/chrome.zip")" = "$(jq -r .mac_arm64.size provider.lock.json)"
          echo "$(jq -r .mac_arm64.sha256 provider.lock.json)  $RUNNER_TEMP/chrome.zip" | shasum -a 256 --check --strict
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/cft"
          echo "NDS_TEST_CHROME=$RUNNER_TEMP/cft/$(jq -r .mac_arm64.executables.NDS_TEST_CHROME provider.lock.json)" >> "$GITHUB_ENV"
      - name: Real-browser acceptance in an isolated profile
        env:
          NDS_E2E_DIAGNOSTICS: "1"
        run: just browser-check

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install pinned Rust toolchain
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          rust-version: '1.99.1'
          rust-components: rustfmt,clippy
      - name: Restore the Cargo dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint and test the client and the host
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Require a typed refusal without a host
        shell: bash
        env:
          NDS_BROWSER_USE_RUNTIME_DIR: ${{ runner.temp }}/no-host
        run: |
          set +e
          output="$(cargo run --locked --quiet --bin nds-browser-use -- status 2>/dev/null)"
          status=$?
          set -e
          echo "status $status: $output"
          test "$status" = 2
          grep -q '^{"error":"[a-z_]*","message":' <<< "$output"
      - name: Fetch the pinned Chrome for Testing
        shell: bash
        run: |
          url="$(jq -r .win64.asset provider.lock.json)"
          curl --fail --location --max-time 300 "$url" --output "$RUNNER_TEMP/chrome.zip"
          test "$(stat -c %s "$RUNNER_TEMP/chrome.zip")" = "$(jq -r .win64.size provider.lock.json)"
          echo "$(jq -r .win64.sha256 provider.lock.json)  $RUNNER_TEMP/chrome.zip" | sha256sum --check --strict
          7z x -bd -o"$RUNNER_TEMP/cft" "$RUNNER_TEMP/chrome.zip" > /dev/null
          echo "NDS_TEST_CHROME=$(cygpath -w "$RUNNER_TEMP/cft/$(jq -r .win64.executables.NDS_TEST_CHROME provider.lock.json)")" >> "$GITHUB_ENV"
      - name: Real-browser acceptance in an isolated profile
        shell: bash
        env:
          NDS_E2E_DIAGNOSTICS: "1"
          # Chrome's own log, which the e2e enables, reaches the job output only through Playwright.
          DEBUG: pw:browser
        run: |
          bun install --frozen-lockfile --ignore-scripts
          cargo build --locked
          NDS_TEST_HOST="$(cygpath -w "$PWD/target/debug/nds-browser-use.exe")" bun run e2e

  merge-stops:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    with:
      hosted-runner: ubuntu-26.04
