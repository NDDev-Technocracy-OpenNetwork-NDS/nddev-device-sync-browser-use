# Public native component acceptance uses isolated Chrome for Testing profiles.
name: native

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare the native job
        id: prepare
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@e2cc2ac3493652bcc0741c6aa999f3e315f705a9 # v0.6.77
        with:
          rust-version: 1.100.0
          rust-components: clippy,rustfmt
          bun-version: 1.4.4
      - name: Prepare locked module dependencies
        id: setup
        run: just setup
      - name: Check source without building
        id: source
        run: just check
      - name: Retain the native and TypeScript test contract
        id: tests
        run: just test
      - name: Fetch the pinned Chrome for Testing
        id: chrome
        run: |
          url="$(jq -r .mac_arm64.asset provider.lock.json)"
          curl --fail --location --max-time 300 "$url" --output "$RUNNER_TEMP/chrome.zip"
          test "$(stat -f %z "$RUNNER_TEMP/chrome.zip")" = "$(jq -r .mac_arm64.size provider.lock.json)"
          echo "$(jq -r .mac_arm64.sha256 provider.lock.json)  $RUNNER_TEMP/chrome.zip" | shasum -a 256 --check --strict
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/cft"
          echo "NDS_TEST_CHROME=$RUNNER_TEMP/cft/$(jq -r .mac_arm64.executables.NDS_TEST_CHROME provider.lock.json)" >> "$GITHUB_ENV"
      - name: Real-browser acceptance in an isolated profile
        id: browser
        env:
          NDS_E2E_DIAGNOSTICS: "1"
        run: just browser-check
      - name: Complete the native job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@e2cc2ac3493652bcc0741c6aa999f3e315f705a9 # v0.6.77
        with:
          status: ${{ job.status }}
          project-outcome: ${{ (steps.setup.outcome == 'failure' || steps.source.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.chrome.outcome == 'failure' || steps.browser.outcome == 'failure') && 'failure' || 'success' }}
          task: browser-macos
          name: browser-macos
          read-token: ${{ steps.prepare.outputs.read-token }}

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare the native job
        id: prepare
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@e2cc2ac3493652bcc0741c6aa999f3e315f705a9 # v0.6.77
        with:
          rust-version: 1.100.0
          rust-components: clippy,rustfmt
          bun-version: 1.4.4
      - name: Prepare locked module dependencies
        id: setup
        run: just setup
      - name: Check source without building
        id: source
        run: just check
      - name: Retain the native and TypeScript test contract
        id: tests
        run: just test
      - name: Require a typed refusal without a host
        id: refusal
        shell: bash
        env:
          NDS_BROWSER_USE_RUNTIME_DIR: ${{ runner.temp }}/no-host
        run: |
          set +e
          output="$(cargo run --locked --quiet --bin nds-browser-use -- status 2>/dev/null)"
          status=$?
          set -e
          echo "status $status: $output"
          test "$status" = 2
          grep -q '^{"error":"[a-z_]*","message":' <<< "$output"
      - name: Fetch the pinned Chrome for Testing
        id: chrome
        shell: bash
        run: |
          url="$(jq -r .win64.asset provider.lock.json)"
          curl --fail --location --max-time 300 "$url" --output "$RUNNER_TEMP/chrome.zip"
          test "$(stat -c %s "$RUNNER_TEMP/chrome.zip")" = "$(jq -r .win64.size provider.lock.json)"
          echo "$(jq -r .win64.sha256 provider.lock.json)  $RUNNER_TEMP/chrome.zip" | sha256sum --check --strict
          7z x -bd -o"$RUNNER_TEMP/cft" "$RUNNER_TEMP/chrome.zip" > /dev/null
          echo "NDS_TEST_CHROME=$(cygpath -w "$RUNNER_TEMP/cft/$(jq -r .win64.executables.NDS_TEST_CHROME provider.lock.json)")" >> "$GITHUB_ENV"
      - name: Real-browser acceptance in an isolated profile
        id: browser
        shell: bash
        env:
          NDS_E2E_DIAGNOSTICS: "1"
          # Chrome's own log, which the e2e enables, reaches the job output only through Playwright.
          DEBUG: pw:browser
        run: |
          cargo build --locked
          NDS_TEST_HOST="$(cygpath -w "$PWD/target/debug/nds-browser-use.exe")" bun run e2e
      - name: Complete the native job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@e2cc2ac3493652bcc0741c6aa999f3e315f705a9 # v0.6.77
        with:
          status: ${{ job.status }}
          project-outcome: ${{ (steps.setup.outcome == 'failure' || steps.source.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.chrome.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.refusal.outcome == 'failure') && 'failure' || 'success' }}
          task: browser-windows
          name: browser-windows
          read-token: ${{ steps.prepare.outputs.read-token }}
